<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<title>Aura</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Tokens shadcn/ui — tema dark "zinc", los mismos del launcher de hectorcflores.github.io */
:root{
  --background:240 10% 3.9%; --foreground:0 0% 98%;
  --card:240 10% 3.9%; --card-foreground:0 0% 98%;
  --primary:0 0% 98%; --primary-foreground:240 5.9% 10%;
  --secondary:240 3.7% 15.9%; --secondary-foreground:0 0% 98%;
  --muted:240 3.7% 15.9%; --muted-foreground:240 5% 64.9%;
  --accent:240 3.7% 15.9%; --accent-foreground:0 0% 98%;
  --border:240 3.7% 15.9%; --ring:240 4.9% 83.9%;
  --radius:0.5rem;
}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 72px;background:hsl(var(--background));color:hsl(var(--foreground));
  font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:min(880px,100%);margin:0 auto}
.tnum{font-variant-numeric:tabular-nums}

/* Encabezado, igual en las cinco */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.h1{margin:0;font-size:16px;font-weight:600;line-height:1;letter-spacing:-.01em}
.h1 + .desc{margin:6px 0 0}
.desc{margin:0;font-size:14px;color:hsl(var(--muted-foreground))}
.stamp{font-size:13px;color:hsl(var(--muted-foreground));white-space:nowrap;padding-top:1px}

/* Card */
.card{border:1px solid hsl(var(--border));border-radius:var(--radius);
  background:hsl(var(--card));color:hsl(var(--card-foreground));box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}
.card-header{display:flex;flex-direction:column;gap:6px;padding:24px}
.card-content{padding:0 24px 24px}
.card-title{font-size:16px;font-weight:600;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.card-desc{font-size:14px;color:hsl(var(--muted-foreground))}

/* Badge */
.badge{display:inline-flex;align-items:center;border-radius:9999px;border:1px solid transparent;
  padding:2px 10px;font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap}
.badge-secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.badge-outline{border-color:hsl(var(--border));color:hsl(var(--foreground))}
.badge-muted{background:hsl(var(--secondary));color:hsl(var(--muted-foreground));font-weight:500}

/* Table */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{height:44px;padding:0 12px;text-align:left;vertical-align:middle;
  font-weight:500;color:hsl(var(--muted-foreground));border-bottom:1px solid hsl(var(--border))}
.table td{padding:14px 12px;vertical-align:top;border-bottom:1px solid hsl(var(--border))}
.table th:first-child,.table td:first-child{padding-left:0}
.table th:last-child,.table td:last-child{padding-right:0}
.table tr.hoverable:hover td{background:hsl(var(--muted)/.5)}

/* Separator */
.sep{height:1px;width:100%;background:hsl(var(--border));border:0;margin:0}

/* Progress — el medidor de score */
.progress{position:relative;height:6px;width:100%;overflow:hidden;border-radius:9999px;
  background:hsl(var(--primary)/.2)}
.progress > i{display:block;height:100%;background:hsl(var(--primary));border-radius:9999px}
.progress.empty{background:hsl(var(--secondary))}

/* Button / ghost, para los toggles */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:calc(var(--radius) - 2px);
  background:transparent;color:hsl(var(--muted-foreground));font:inherit;font-size:13px;font-weight:500;
  padding:6px 10px;margin-left:-10px;cursor:pointer;transition:background-color .15s,color .15s}
.btn:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.btn .chev{display:inline-block;font-size:10px;transition:transform .15s}
.btn[aria-expanded="true"] .chev{transform:rotate(90deg)}

/* Score: etiqueta + cifra + barra, reutilizado en las cinco */
.score{display:grid;gap:4px;min-width:66px}
.score .k{font-size:11px;font-weight:500;color:hsl(var(--muted-foreground))}
.score .v{font-size:15px;font-weight:600;line-height:1}
.score .v.off{color:hsl(var(--muted-foreground));font-weight:400}

/* Cita de reseña */
.quote{margin:0;font-size:13.5px;line-height:1.55;color:hsl(var(--foreground))}
.quote cite{display:block;margin-top:3px;font-size:12px;font-style:normal;color:hsl(var(--muted-foreground))}
.quotes{display:grid;gap:12px;max-width:64ch}

.meta{font-size:13px;color:hsl(var(--muted-foreground))}
.orig{color:hsl(var(--muted-foreground))}
.times{display:flex;flex-wrap:wrap;gap:6px}
.foot{margin-top:28px;font-size:12px;color:hsl(var(--muted-foreground))}
:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring));border-radius:calc(var(--radius) - 2px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.list{display:grid;gap:2px}
.item{display:grid;gap:2px;width:100%;text-align:left;border:0;cursor:pointer;
  border-radius:calc(var(--radius) - 2px);background:transparent;color:hsl(var(--foreground));
  font:inherit;padding:10px 12px;transition:background-color .15s}
.item:hover{background:hsl(var(--accent))}
.item[aria-current="true"]{background:hsl(var(--secondary))}
.item{gap:4px;padding:11px 12px}
.item .n{font-size:14px;font-weight:500;letter-spacing:-.01em;line-height:1.3}
.item .f{font-size:12px;color:hsl(var(--muted-foreground));line-height:1.35}
.item .d{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;
  align-items:end}
.item .h{font-size:12px;color:hsl(var(--muted-foreground))}

/* Ambos scores visibles en la lista, sin abrir la ficha. */
.minis{display:flex;gap:14px;flex:none}
.mini{display:grid;gap:1px}
.mini .mk{font-size:10px;color:hsl(var(--muted-foreground));line-height:1.3}
.mini b{font-size:13px;font-weight:600;line-height:1.2}
.mini b.off{color:hsl(var(--muted-foreground));font-weight:400}
.panel{padding:24px}
.panel h2{margin:0;font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.panel .orig{display:block;margin-top:3px;font-size:14px;font-weight:400}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;margin:20px 0 0}
.dl div{display:grid;gap:2px}
.dl dt{font-size:11px;color:hsl(var(--muted-foreground))}
.dl dd{margin:0;font-size:14px}
.scores{display:flex;gap:28px;margin-top:22px}
.panel .sep{margin:22px 0}
.rt{font-size:11px;color:hsl(var(--muted-foreground));margin:0 0 12px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}

/* Estados de carga y de cartelera vacía. */
.msg{padding:24px;color:hsl(var(--muted-foreground));font-size:14px}
.msg b{display:block;margin-bottom:4px;color:hsl(var(--foreground));font-weight:500}
.skel{display:grid;gap:8px}
.skel span{height:12px;border-radius:4px;background:hsl(var(--muted))}
.src{margin-top:4px;font-size:11px;color:hsl(var(--muted-foreground))}
.panel a{color:hsl(var(--muted-foreground))}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1 class="h1">Aura</h1><p class="desc" id="sub">Cargando cartelera…</p></div>
    <span class="stamp" id="dia"></span>
  </div>
  <div class="split">
    <nav class="list" id="ls" aria-label="Cartelera de hoy"></nav>
    <div class="card" id="pn"><div class="msg skel"><span style="width:60%"></span><span style="width:85%"></span><span style="width:40%"></span></div></div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls = document.getElementById("ls"), pn = document.getElementById("pn");
const sub = document.getElementById("sub"), dia = document.getElementById("dia");

/* Mismo componente de score del prototipo: etiqueta, cifra y barra. */
const score = (k, v, frac, suf = "") => `
  <div class="score">
    <span class="k">${k}</span>
    <span class="v tnum${v == null ? " off" : ""}">${v == null ? "—" : v + suf}</span>
    <span class="progress${v == null ? " empty" : ""}"><i style="width:${v == null ? 0 : frac * 100}%"></i></span>
  </div>`;

/* Lo que se ve en la lista sin dar clic: país, año, duración y ambos scores. */
const fichaCorta = p => [
  esc(p.pais),
  p.ano ? `<span class="tnum">${p.ano}</span>` : null,
  p.duracion ? `<span class="tnum">${p.duracion} min</span>` : null,
].filter(Boolean).join(" · ") || "—";

const mini = (k, v, suf = "") => `
  <span class="mini"><span class="mk">${k}</span>
  <b class="tnum${v == null ? " off" : ""}">${v == null ? "—" : v + suf}</b></span>`;

let CART = null, sel = 0;

function pintaLista() {
  ls.innerHTML = CART.peliculas.map((p, i) => `
    <button class="item" aria-current="${i === sel}" data-i="${i}">
      <span class="n">${esc(p.titulo)}</span>
      <span class="f">${fichaCorta(p)}</span>
      <span class="d">
        <span class="h tnum">${p.horarios.join(" · ")}</span>
        <span class="minis">
          ${mini("Crítica", p.critica, "%")}${mini("Público", p.publico?.toFixed(1))}
        </span>
      </span>
    </button>`).join("");
}

function pintaPanel() {
  const p = CART.peliculas[sel];
  const enlaces = [
    p.urlCineteca ? `<a href="${esc(p.urlCineteca)}" target="_blank" rel="noopener">Ficha en Cineteca</a>` : "",
    p.urlImdb ? `<a href="${esc(p.urlImdb)}" target="_blank" rel="noopener">IMDb</a>` : "",
  ].filter(Boolean).join(" · ");

  pn.innerHTML = `<div class="panel">
    <h2>${esc(p.titulo)}${p.tituloOriginal ? `<span class="orig">${esc(p.tituloOriginal)}</span>` : ""}</h2>
    <dl class="dl">
      <div><dt>Dirección</dt><dd>${esc(p.director) || "—"}</dd></div>
      <div><dt>País y año</dt><dd>${esc(p.pais) || "—"}${p.ano ? ` · <span class="tnum">${p.ano}</span>` : ""}</dd></div>
      <div><dt>Duración</dt><dd class="tnum">${p.duracion ? p.duracion + " min" : "—"}</dd></div>
      <div><dt>Sala</dt><dd>${esc(p.sala) || "—"}</dd></div>
    </dl>
    <div class="times" style="margin-top:20px">
      ${p.horarios.map(h => `<span class="badge badge-secondary tnum">${esc(h)}</span>`).join("")}</div>
    <div class="scores">
      ${score("Crítica", p.critica, p.critica / 100, "%")}
      ${score("Público", p.publico, p.publico / 10)}
    </div>
    <p class="src">${[p.criticaFuente, p.publicoFuente].filter(Boolean).join(" · ") || "Sin scores disponibles"}</p>
    <hr class="sep">
    ${p.resenas.length
      ? `<p class="rt">${p.resenas.length} reseña${p.resenas.length > 1 ? "s" : ""}</p>
         <div class="quotes">${p.resenas.map(r => `
           <p class="quote">“${esc(r.texto)}”<cite>${esc(r.autor)}</cite></p>`).join("")}</div>`
      : `<p class="rt">Sin reseñas disponibles para esta película.</p>`}
    ${enlaces ? `<p class="src" style="margin-top:16px">${enlaces}</p>` : ""}
  </div>`;
}

function vacio(titulo, detalle) {
  ls.innerHTML = "";
  pn.innerHTML = `<div class="msg"><b>${esc(titulo)}</b>${esc(detalle)}</div>`;
}

ls.addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  sel = Number(b.dataset.i); pintaLista(); pintaPanel();
});

/* cache:"no-store" para que el navegador no sirva la cartelera de ayer. */
fetch("./data/cartelera.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(d => {
    CART = d;
    dia.textContent = d.fechaTexto || "";
    document.getElementById("foot").textContent =
      "Rotten Tomatoes vía OMDb · IMDb · TMDB · Cineteca Nacional";
    if (!d.peliculas || !d.peliculas.length) {
      sub.textContent = d.sede || "Cineteca Nacional · Xoco";
      vacio(d.pendiente ? "Aún no hay cartelera" : "Hoy no hay funciones",
        d.pendiente
          ? "La cartelera se genera cada mañana; el primer build todavía no corre."
          : "No se encontraron funciones programadas para hoy.");
      return;
    }
    sub.textContent = `${d.sede} · ${d.peliculas.length} película${d.peliculas.length > 1 ? "s" : ""} hoy`;
    pintaLista(); pintaPanel();
  })
  .catch(err => {
    sub.textContent = "Cineteca Nacional · Xoco";
    vacio("No se pudo cargar la cartelera", `${err.message}. Vuelve a intentar en un momento.`);
  });
</script>
</body>
</html>
