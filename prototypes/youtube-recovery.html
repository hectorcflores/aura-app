<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura · Prueba de recuperación</title><style>body{background:#09090b;color:#fafafa;font:14px system-ui;margin:0;padding:24px}.wrap{max-width:560px;margin:auto}h1{font-size:20px}p,small{color:#a1a1aa;line-height:1.6}.card{background:#18181b;border:1px solid #27272a;border-radius:8px;padding:20px}.video{aspect-ratio:16/9;min-height:200px;background:#09090b}.video iframe{width:100%;height:100%;border:0}button,a{color:#fafafa;background:#27272a;border:0;border-radius:6px;padding:10px;cursor:pointer;font:inherit}a{display:inline-block;text-decoration:none}pre{white-space:pre-wrap;color:#a1a1aa;font-size:12px;line-height:1.6}[hidden]{display:none!important}</style><div class="wrap"><h1>Aura · Prueba de recuperación</h1><p>Prueba real: empieza con el video bloqueado de Nanawa y cambia al alternativo si YouTube devuelve un error.</p><div class="card"><h2>El príncipe de Nanawa</h2><div class="video"><div id="player"></div></div><p id="status" role="status">Cargando YouTube…</p><button id="manual" hidden>Reproducir</button><a id="external" hidden target="_blank" rel="noopener">Ver en YouTube</a></div><p><button id="restart">Repetir prueba</button></p><small>Registro de esta prueba (no forma parte del diseño de Aura)</small><pre id="log"></pre></div><script>
const ids=['apErqeR1IqU','O2uaTE3eXcg'];let player,index=0,timer,playing=false;
const status=document.getElementById('status'),log=document.getElementById('log'),manual=document.getElementById('manual'),external=document.getElementById('external');
function record(s){log.textContent+=s+'\n'}
function watch(){clearTimeout(timer);timer=setTimeout(()=>{if(!playing){record('Espera agotada; no se asume una causa.');hideTrailer()}},15000)}
function hideTrailer(){clearTimeout(timer);player?.stopVideo?.();document.querySelector('.video').hidden=true;manual.hidden=true;external.hidden=true;status.hidden=true;record('Sin reproducción disponible: bloque del tráiler oculto.')}
function attempt(){document.querySelector('.video').hidden=false;status.hidden=false;external.hidden=true;playing=false;manual.hidden=true;external.href='https://www.youtube.com/watch?v='+ids[index];status.textContent=index?'Probando otra publicación…':'Probando el video original…';record('Intento '+(index+1)+': '+ids[index]);player.mute();player.loadVideoById(ids[index]);watch()}
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{width:560,height:315,host:'https://www.youtube-nocookie.com',playerVars:{playsinline:1,origin:location.origin},events:{onReady:attempt,onError:e=>{clearTimeout(timer);record('Error de YouTube: '+e.data);if([100,101,150].includes(e.data)&&index<ids.length-1){index++;attempt()}else{hideTrailer()}},onStateChange:e=>{record('Estado: '+e.data);if(e.data===1){playing=true;clearTimeout(timer);manual.hidden=true;status.textContent=index?'Recuperación exitosa: reproduciendo la alternativa sin sonido.':'Reproduciendo el original sin sonido.'}},onAutoplayBlocked:()=>{clearTimeout(timer);status.textContent='El navegador requiere un toque para reproducir.';manual.hidden=false;record('Autoplay bloqueado: se conserva el video.')}}})}
manual.onclick=()=>{player.mute();player.playVideo();watch()};document.getElementById('restart').onclick=()=>{if(!player?.loadVideoById)return;index=0;log.textContent='';attempt()};window.addEventListener('pagehide',()=>{clearTimeout(timer);player?.destroy?.()});
</script><script src="https://www.youtube.com/iframe_api"></script></html>
