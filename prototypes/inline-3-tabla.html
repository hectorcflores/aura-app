<title>Aura · Tabla expandible</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>/* Tokens shadcn/ui — tema dark "zinc", los mismos del launcher de hectorcflores.github.io */
:root{
  --background:240 10% 3.9%; --foreground:0 0% 98%;
  --card:240 10% 3.9%; --card-foreground:0 0% 98%;
  --primary:0 0% 98%; --primary-foreground:240 5.9% 10%;
  --secondary:240 3.7% 15.9%; --secondary-foreground:0 0% 98%;
  --muted:240 3.7% 15.9%; --muted-foreground:240 5% 64.9%;
  --accent:240 3.7% 15.9%; --accent-foreground:0 0% 98%;
  --border:240 3.7% 15.9%; --ring:240 4.9% 83.9%;
  --radius:0.5rem;
}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 72px;background:hsl(var(--background));color:hsl(var(--foreground));
  font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:min(880px,100%);margin:0 auto}
.tnum{font-variant-numeric:tabular-nums}

/* Encabezado, igual en las cinco */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.h1{margin:0;font-size:16px;font-weight:600;line-height:1;letter-spacing:-.01em}
.h1 + .desc{margin:6px 0 0}
.desc{margin:0;font-size:14px;color:hsl(var(--muted-foreground))}
.stamp{font-size:13px;color:hsl(var(--muted-foreground));white-space:nowrap;padding-top:1px}

/* Card */
.card{border:1px solid hsl(var(--border));border-radius:var(--radius);
  background:hsl(var(--card));color:hsl(var(--card-foreground));box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}
.card-header{display:flex;flex-direction:column;gap:6px;padding:24px}
.card-content{padding:0 24px 24px}
.card-title{font-size:16px;font-weight:600;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.card-desc{font-size:14px;color:hsl(var(--muted-foreground))}

/* Badge */
.badge{display:inline-flex;align-items:center;border-radius:9999px;border:1px solid transparent;
  padding:2px 10px;font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap}
.badge-secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.badge-outline{border-color:hsl(var(--border));color:hsl(var(--foreground))}
.badge-muted{background:hsl(var(--secondary));color:hsl(var(--muted-foreground));font-weight:500}

/* Table */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{height:44px;padding:0 12px;text-align:left;vertical-align:middle;
  font-weight:500;color:hsl(var(--muted-foreground));border-bottom:1px solid hsl(var(--border))}
.table td{padding:14px 12px;vertical-align:top;border-bottom:1px solid hsl(var(--border))}
.table th:first-child,.table td:first-child{padding-left:0}
.table th:last-child,.table td:last-child{padding-right:0}
.table tr.hoverable:hover td{background:hsl(var(--muted)/.5)}

/* Separator */
.sep{height:1px;width:100%;background:hsl(var(--border));border:0;margin:0}

/* Progress — el medidor de score */
.progress{position:relative;height:6px;width:100%;overflow:hidden;border-radius:9999px;
  background:hsl(var(--primary)/.2)}
.progress > i{display:block;height:100%;background:hsl(var(--primary));border-radius:9999px}
.progress.empty{background:hsl(var(--secondary))}

/* Button / ghost, para los toggles */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:calc(var(--radius) - 2px);
  background:transparent;color:hsl(var(--muted-foreground));font:inherit;font-size:13px;font-weight:500;
  padding:6px 10px;margin-left:-10px;cursor:pointer;transition:background-color .15s,color .15s}
.btn:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.btn .chev{display:inline-block;font-size:10px;transition:transform .15s}
.btn[aria-expanded="true"] .chev{transform:rotate(90deg)}

/* Score: etiqueta + cifra + barra, reutilizado en las cinco */
.score{display:grid;gap:4px;min-width:66px}
.score .k{font-size:11px;font-weight:500;color:hsl(var(--muted-foreground))}
.score .v{font-size:15px;font-weight:600;line-height:1}
.score .v.off{color:hsl(var(--muted-foreground));font-weight:400}

/* Cita de reseña */
.quote{margin:0;font-size:13.5px;line-height:1.55;color:hsl(var(--foreground))}
.quote cite{display:block;margin-top:3px;font-size:12px;font-style:normal;color:hsl(var(--muted-foreground))}
.quotes{display:grid;gap:12px;max-width:64ch}

.meta{font-size:13px;color:hsl(var(--muted-foreground))}
.orig{color:hsl(var(--muted-foreground))}
.times{display:flex;flex-wrap:wrap;gap:6px}
.foot{margin-top:28px;font-size:12px;color:hsl(var(--muted-foreground))}
:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring));border-radius:calc(var(--radius) - 2px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- añadidos de la ronda 4 --- */
.minis{display:flex;gap:18px;flex:none}
.mini{display:grid;gap:1px;min-width:52px}
.mk{font-size:11px;color:hsl(var(--muted-foreground));line-height:1.3}
.mini b{font-size:14px;font-weight:600;line-height:1.2}
.mini b.off{color:hsl(var(--muted-foreground));font-weight:400}
.det-in{padding:20px}
.det-in .dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;margin:0}
.det-in .dl div{display:grid;gap:3px;align-content:start}
.det-in dt{font-size:11px;color:hsl(var(--muted-foreground))}
.det-in dd{margin:0;font-size:14px}
.det-in .scores{display:flex;gap:28px;margin-top:20px}
.det-in .sep{margin:20px 0}
@media(max-width:560px){.det-in .dl{grid-template-columns:minmax(0,1fr)}}
.table td{padding:14px 12px;vertical-align:middle}
.table tr.film{cursor:pointer}
.table tr.film:hover td{background:hsl(var(--muted)/.5)}
.table tr.film.open td{background:hsl(var(--muted)/.5)}
.nm{font-size:14.5px;font-weight:500;letter-spacing:-.01em}
.nm .chev{display:inline-block;margin-left:7px;font-size:10px;
  color:hsl(var(--muted-foreground));transition:transform .15s}
.table tr.film.open .nm .chev{transform:rotate(90deg)}
.fi{margin-top:2px;font-size:13px;color:hsl(var(--muted-foreground))}
td.sc{width:74px;text-align:right}
td.sc b{font-size:14px;font-weight:600}
td.sc b.off{color:hsl(var(--muted-foreground));font-weight:400}
td.fn{width:132px}
tr.det td{padding:0 0 18px;border-bottom:1px solid hsl(var(--border))}
tr.det .card{background:hsl(var(--muted)/.35)}
.mob{display:none}
@media(max-width:680px){
  .table thead{display:none}
  .table td.fn,.table td.sc{display:none}
  .table tr.film{display:block;padding:14px 0;border-bottom:1px solid hsl(var(--border))}
  .table tr.film td{display:block;border:0;padding:0}
  .mob{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:9px}
  .mob .hrs{font-size:13px}
  tr.det{display:block}
  tr.det td{display:block;border:0;padding:12px 0 18px}
}
</style>
<div class="wrap">
  <div class="head"><div><h1 class="h1">Aura</h1><p class="desc" id="sub"></p></div><span class="stamp" id="dia"></span></div>
  <table class="table">
    <thead><tr>
      <th>Película</th><th>Funciones</th><th style="text-align:right">Crítica</th><th style="text-align:right">Público</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <p class="foot">Rotten Tomatoes vía OMDb · IMDb · TMDB — datos de ejemplo</p>
</div>
<script>/* Datos de ejemplo. Películas y scores reales; horarios, salas y reseñas son ilustrativos. */
const FILMS = [
  { t:"Anora", o:null, dir:"Sean Baker", pais:"Estados Unidos", ano:2024, min:139,
    sala:"A", horas:["19:00","21:45"], rt:91, im:7.5,
    r:[{q:"Comedia hasta que deja de serlo, y el silencio final te cobra todo.",a:"@mikaela.r"},
       {q:"Mikey Madison no actúa el personaje, lo agota.",a:"@rgomez"}]},
  { t:"Aún estoy aquí", o:"Ainda Estou Aqui", dir:"Walter Salles", pais:"Brasil", ano:2024, min:135,
    sala:"B", horas:["16:00","18:45","21:30"], rt:96, im:8.4,
    r:[{q:"Fernanda Torres sostiene la película con la mirada: no llora, recuerda.",a:"@lunacinefila"},
       {q:"Un expediente burocrático convertido en el thriller más doloroso del año.",a:"@jmndz"}]},
  { t:"Perfect Days", o:null, dir:"Wim Wenders", pais:"Japón · Alemania", ano:2023, min:124,
    sala:"A", horas:["17:20"], rt:96, im:7.9,
    r:[{q:"Dos horas de rutina y sales convencido de que limpiar baños es una vocación.",a:"@hoja_seca"},
       {q:"Kōji Yakusho sonríe en el último plano y desarma la película entera.",a:"@t_navarro"}]},
  { t:"La cocina", o:null, dir:"Alonso Ruizpalacios", pais:"México", ano:2024, min:139,
    sala:"C", horas:["16:00","20:00"], rt:87, im:6.9,
    r:[{q:"El blanco y negro no es nostalgia, es vapor de cocina industrial.",a:"@tacosdecine"},
       {q:"Se siente el ruido. Salí con hambre y con culpa.",a:"@ana_vr"}]},
  { t:"Stalker", o:"Сталкер", dir:"Andrei Tarkovski", pais:"URSS", ano:1979, min:162,
    sala:"B", horas:["19:00"], rt:100, im:8.1,
    r:[{q:"Tres hombres caminan dos horas y media y uno sale distinto.",a:"@zonagris"},
       {q:"El plano del agua sobre los azulejos vale la butaca entera.",a:"@cinefilo_77"}]},
  { t:"Sueño en otro idioma", o:null, dir:"Ernesto Contreras", pais:"México", ano:2017, min:101,
    sala:"C", horas:["17:20"], rt:null, im:7.0,
    r:[{q:"Una lengua muerta como excusa para hablar de lo que no se dijo a tiempo.",a:"@memoriafilm"}]}
];
const HOY = "Jueves 3 de septiembre";
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const meta = p => `${p.dir} · ${p.pais} · ${p.ano} · ${p.min} min`;
const titulo = p => `${esc(p.t)}${p.o?` <span class="orig">${esc(p.o)}</span>`:""}`;
const cita = x => `<p class="quote">“${esc(x.q)}”<cite>${esc(x.a)}</cite></p>`;
const citas = p => `<div class="quotes">${p.r.map(cita).join("")}</div>`;
/* Score en el idioma de shadcn: etiqueta muted, cifra, y un Progress debajo. */
const score = (k, v, frac, suf="") => `
  <div class="score">
    <span class="k">${k}</span>
    <span class="v tnum${v==null?" off":""}">${v==null?"—":v+suf}</span>
    <span class="progress${v==null?" empty":""}"><i style="width:${v==null?0:frac*100}%"></i></span>
  </div>`;
const critica = p => score("Crítica", p.rt, p.rt/100, "%");
const publico = p => score("Público", p.im.toFixed(1), p.im/10);
const HEAD = `
  <div class="head">
    <div>
      <h1 class="h1">Aura</h1>
      <p class="desc" id="sub"></p>
    </div>
    <span class="stamp">${HOY}</span>
  </div>`;
const FOOT = `<p class="foot">Rotten Tomatoes vía OMDb · IMDb · TMDB — datos de ejemplo</p>`;

/* Par compacto etiqueta+cifra para la fila cerrada: ambos scores visibles antes del clic. */
const mini = (k, v, suf="") => `
  <span class="mini"><span class="mk">${k}</span>
  <b class="tnum${v==null?" off":""}">${v==null?"—":v+suf}</b></span>`;
const minis = p => `<span class="minis">${mini("Crítica",p.rt,"%")}${mini("Público",p.im.toFixed(1))}</span>`;
/* Ficha corta: lo que pidió ver sin abrir nada. */
const fichaCorta = p => `${esc(p.pais)} · <span class="tnum">${p.ano}</span> · <span class="tnum">${p.min} min</span>`;
/* El detalle ya no repite país/año/duración: aporta lo que la fila no trae. */
const detalle = p => `
  <div class="det-in">
    <dl class="dl">
      <div><dt>Dirección</dt><dd>${esc(p.dir)}</dd></div>
      <div><dt>Sala</dt><dd>Sala ${esc(p.sala)}</dd></div>
      ${p.o?`<div><dt>Título original</dt><dd>${esc(p.o)}</dd></div>`:""}
      <div><dt>Funciones</dt><dd class="times">${p.horas.map(h=>`<span class="badge badge-secondary tnum">${h}</span>`).join("")}</dd></div>
    </dl>
    <div class="scores">${critica(p)}${publico(p)}</div>
    <hr class="sep">
    ${citas(p)}
  </div>`;
document.getElementById("sub").textContent = `${FILMS.length} películas hoy`;
let abierta = 0;
const tb = document.getElementById("tb");
function pinta(){
  tb.innerHTML = FILMS.map((p,i)=>`
  <tr class="film${i===abierta?" open":""}" data-i="${i}" tabindex="0"
      role="button" aria-expanded="${i===abierta}">
    <td>
      <div class="nm">${esc(p.t)}<span class="chev">›</span></div>
      <div class="fi">${fichaCorta(p)}</div>
      <div class="mob"><span class="hrs tnum">${p.horas.join(" · ")}</span>${minis(p)}</div>
    </td>
    <td class="fn tnum">${p.horas.join(" · ")}</td>
    <td class="sc"><b class="tnum${p.rt==null?" off":""}">${p.rt==null?"—":p.rt+"%"}</b></td>
    <td class="sc"><b class="tnum">${p.im.toFixed(1)}</b></td>
  </tr>
  ${i===abierta?`<tr class="det"><td colspan="4"><div class="card">${detalle(p)}</div></td></tr>`:""}`
  ).join("");
}
function alterna(i){ abierta = (abierta===i) ? -1 : i; pinta(); }
tb.addEventListener("click", e=>{
  const r = e.target.closest("tr.film"); if(r) alterna(Number(r.dataset.i));
});
tb.addEventListener("keydown", e=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const r = e.target.closest("tr.film"); if(!r) return;
  e.preventDefault(); alterna(Number(r.dataset.i));
});
pinta();

document.getElementById("dia").textContent = HOY;
</script>
