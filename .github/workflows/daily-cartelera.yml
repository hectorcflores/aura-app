name: Cartelera diaria

on:
  schedule:
    # GitHub ejecuta estos crons con 3-4 horas de retraso (medido el 4-sep-2026:
    # 12:37 UTC corrió a las 16:33; 14:23 corrió a las 17:38). Se programan de
    # madrugada CDMX para que, aun retrasados, la cartelera esté lista temprano.
    # Minutos fuera de la hora en punto a propósito: GitHub descarta crons en
    # :00 cuando va cargado. Si nada cambió entre corridas, no hay commit.
    - cron: "7 7 * * *"     # 01:07 CDMX (UTC-6 todo el año desde 2022)
    - cron: "23 9 * * *"    # 03:23 CDMX
    - cron: "23 14 * * *"   # 08:23 CDMX, respaldo
  workflow_dispatch:
  # Cualquier cambio al scraper reconstruye la cartelera de inmediato. El commit
  # del bot solo toca app/data/, así que no se dispara a sí mismo.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - ".github/workflows/daily-cartelera.yml"

permissions:
  contents: write

jobs:
  build:
    name: Construir la cartelera del día
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cartelera
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # npm en el runner ha tardado 3-4 min en instalar 23 paquetes (y a veces
      # más, hasta caer por timeout). node_modules se cachea por hash del
      # lockfile: la primera corrida instala, las siguientes se lo saltan.
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        if: steps.nm.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npm ci --no-audit --no-fund --loglevel=warn

      - name: Construir cartelera
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: npm run build

      - name: Commitear si cambió
        run: |
          if git diff --quiet -- app/data/cartelera.json; then
            echo "La cartelera no cambió; no hay nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/cartelera.json
          git commit -m "Cartelera del $(TZ=America/Mexico_City date +%Y-%m-%d)"
          # Si main avanzó mientras corría el scraper, el JSON del bot va encima.
          git pull --rebase -X theirs origin main
          git push
